    <style>
      :root {
        --primary: #ea580c;
        --secondary: #9a3412;
        --app-bg: #fffaf0;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--app-bg);
        margin: 0;
        padding: 0;
        transition: background-color 0.3s ease;
        -webkit-tap-highlight-color: transparent;
      }
      #loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #fffaf0;
        z-index: 9999;
        transition: opacity 0.4s ease-out;
      }
      .spinner {
        width: 45px;
        height: 45px;
        border: 4px solid #fed7aa;
        border-top: 4px solid var(--primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      .fade-in { animation: fadeIn 0.3s ease-in-out; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .animate-slideUp { animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1); }
      @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      .shadow-soft { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); }
      .bg-primary { background-color: var(--primary) !important; }
      .text-primary { color: var(--primary) !important; }
      .border-primary { border-color: var(--primary) !important; }
      
      /* Toggle Switch Styling */
      .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
      .switch input { opacity: 0; width: 0; height: 0; }
      .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #e2e8f0; transition: .4s; border-radius: 24px; }
      .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
      input:checked + .slider { background-color: var(--primary); }
      input:checked + .slider:before { transform: translateX(20px); }
    </style>
    <script type="importmap">

    <script type="text/babel" data-type="module">
      import React, { useState, useEffect, useMemo } from 'react';

      const ADMIN_PASSWORD = "Pawan1645@";

      const INITIAL_PRODUCTS = [
        { id: "1", name: "Bastasha", description: "Traditional sugar drops, airy and sweet.", price: 50, weight: "250g", category: "Sweets", image: "https://images.unsplash.com/photo-1589119634709-02334005b871?auto=format&fit=crop&q=80&w=400" },
        { id: "2", name: "Motichoor", description: "Tiny pearls of gram flour fried in pure ghee.", price: 50, weight: "250g", category: "Sweets", image: "https://images.unsplash.com/photo-1626082866704-281c59833756?auto=format&fit=crop&q=80&w=400" },
        { id: "3", name: "Ladoo", description: "Classic sweet balls made with high-quality ingredients.", price: 60, weight: "250g", category: "Sweets", image: "https://images.unsplash.com/photo-1621447508323-271228a7fd80?auto=format&fit=crop&q=80&w=400" },
        { id: "4", name: "Malai Barfi", description: "Rich, creamy milk fudge with a soft texture.", price: 100, weight: "250g", category: "Sweets", image: "https://images.unsplash.com/photo-1605065539334-0370428a2729?auto=format&fit=crop&q=80&w=400" },
        { id: "5", name: "Milk Cake", description: "Gram flour and ghee based sweet with a porous texture.", price: 100, weight: "250g", category: "Sweets", image: "https://images.unsplash.com/photo-1621447508323-271228a7fd80?auto=format&fit=crop&q=80&w=400" },
        { id: "10", name: "Kaju Katli", description: "Premium cashew fudge with silver leaf.", price: 200, weight: "250g", category: "Sweets", image: "https://images.unsplash.com/photo-1621447508323-271228a7fd80?auto=format&fit=crop&q=80&w=400" }
      ];

      const DEFAULT_HOME_CONTENT = {
        banner: {
          show: true,
          title: "Buy 1KG Sweets\nGet 250g FREE!",
          subtitle: "Festival Special",
          footer: "Valid on Bastasha & Motichoor",
          image: "https://images.unsplash.com/photo-1599785209707-a456fc1337bb?auto=format&fit=crop&q=80&w=800"
        },
        quote: {
          show: true,

        },
        note: {
          show: true,

          text: "\"At RamDev Shop, purity is our religion. Every batch of sweets is prepared using 100% pure desi ghee and handpicked ingredients, just the way it was done generations ago. We invite you to taste the tradition.\"",
          ownerName: "Pawan Ponnam",
          ownerTitle: "Master Confectioner"
        }
      };

      const DEFAULT_SETTINGS = {
        appName: "RamDev Shop",
        minOrder: 100,
        platformFee: 1,
        deliveryFee: 10,
        ownerWhatsApp: "918369258002",
        upiId: "pawanponnam-1@okicici",
        theme: {
          primary: "#ea580c"
        },

      };

      const generateInvoicePDF = (order, shopName) => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.setFontSize(24);
        doc.text(shopName.toUpperCase(), 20, 25);
        doc.setFontSize(10);
        doc.setTextColor(100);
        doc.text(`INVOICE ID: #RD-${order.id.slice(-6).toUpperCase()}`, 20, 35);
        doc.text(`DATE: ${new Date(order.date).toLocaleString()}`, 20, 40);
        doc.setFillColor(249, 250, 251);
        doc.rect(20, 50, 170, 30, 'F');
        doc.setFontSize(12);
        doc.setTextColor(0);
        doc.text("CUSTOMER DETAILS", 25, 58);
        doc.setFontSize(10);
        doc.text(`Name: ${order.profile.fullName}`, 25, 65);
        doc.text(`Phone: ${order.profile.phone}`, 25, 70);
        doc.text(`Address: ${order.profile.address}`, 25, 75, { maxWidth: 160 });
        const tableData = order.cart.map((item) => [item.name, `x${item.quantity}`, `Rs. ${item.price}`, `Rs. ${item.price * item.quantity}`]);
        doc.autoTable({
          startY: 90,
          head: [['Product', 'Qty', 'Unit Price', 'Total']],
          body: tableData,
          theme: 'striped',
          headStyles: { fillColor: [234, 88, 12], textColor: [255, 255, 255] },
        });
        doc.save(`${shopName}_Invoice_${order.id.slice(-4)}.pdf`);
      };

      const AdminDashboard = ({ appData, onUpdateAppData, onBack }) => {
        const [activeTab, setActiveTab] = useState('products');
        const [editingProduct, setEditingProduct] = useState(null);
        const [ghToken, setGhToken] = useState(localStorage.getItem('gh_token') || '');
        const [ghRepo, setGhRepo] = useState(localStorage.getItem('gh_repo') || ''); 
        const [isSyncing, setIsSyncing] = useState(false);
        const [syncMessage, setSyncMessage] = useState('');

        const syncToGithub = async () => {
          if (!ghToken || !ghRepo) return alert("Please set GitHub credentials.");
          setIsSyncing(true); setSyncMessage('Syncing...');
          try {
            const url = `https://api.github.com/repos/${ghRepo}/contents/products.json`;
            const headers = { 'Authorization': `token ${ghToken}`, 'Accept': 'application/vnd.github.v3+json' };
            const getRes = await fetch(url, { headers });
            let sha = getRes.ok ? (await getRes.json()).sha : "";
            const content = btoa(unescape(encodeURIComponent(JSON.stringify(appData, null, 2))));
            const putRes = await fetch(url, { method: 'PUT', headers, body: JSON.stringify({ message: `Update: ${new Date().toLocaleString()}`, content, sha: sha || undefined }) });
            if (!putRes.ok) throw new Error('Sync failed.');
            localStorage.setItem('gh_token', ghToken); localStorage.setItem('gh_repo', ghRepo);
            setSyncMessage('SUCCESS!'); setTimeout(() => setSyncMessage(''), 3000);
          } catch (err) { alert(err.message); setSyncMessage('Failed'); } 
          finally { setIsSyncing(false); }
        };

        const updateHomeContent = (section, key, value) => {
          onUpdateAppData({
            ...appData,
            settings: {
              ...appData.settings,
              homeContent: {
                ...appData.settings.homeContent,
                [section]: {
                  ...appData.settings.homeContent[section],
                  [key]: value
                }
              }
            }
          });
        };

        return (
          <div className="min-h-screen bg-white pb-40 fade-in p-4 pt-8 text-left overflow-y-auto max-w-md mx-auto">
            <div className="flex items-center justify-between mb-8 px-2">
              <h1 className="text-2xl font-black text-gray-900 uppercase tracking-tighter">ADMIN PANEL</h1>
              <button onClick={onBack} className="w-10 h-10 bg-white rounded-full flex items-center justify-center border shadow-sm"><i className="fas fa-times text-gray-400"></i></button>
            </div>
            
            <div className="flex gap-2 mb-8 overflow-x-auto no-scrollbar py-2 border-b">
              {['products', 'home ui', 'categories', 'settings', 'sync'].map(tab => (
                <button key={tab} onClick={() => setActiveTab(tab)} className={`px-5 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all flex-shrink-0 ${activeTab === tab ? 'bg-primary text-white shadow-lg' : 'bg-white text-gray-400 border border-gray-100'}`}>{tab}</button>
              ))}
            </div>

            {activeTab === 'products' && (
              <div className="space-y-4">
                <button onClick={() => setEditingProduct({ id: '', name: '', price: 0, weight: '', category: appData.categories[0], image: '', description: '', isNew: true })} className="w-full py-5 bg-primary text-white rounded-2xl font-black shadow-lg uppercase text-xs tracking-widest active:scale-95 transition-all">ADD NEW ITEM</button>
                <div className="space-y-3">
                  {appData.products.map(p => (
                    <div key={p.id} className="bg-white p-4 rounded-2xl border flex items-center gap-4 shadow-sm">
                      <img src={p.image} className="w-16 h-16 object-cover rounded-xl bg-gray-50" onError={e=>e.target.src='https://via.placeholder.com/100?text=Sweet'} />
                      <div className="flex-1"><h4 className="font-bold text-sm text-gray-900">{p.name}</h4><p className="text-[10px] text-gray-400 font-bold uppercase">₹{p.price} • {p.category}</p></div>
                      <div className="flex gap-2">
                        <button onClick={() => setEditingProduct(p)} className="w-10 h-10 bg-orange-50 text-primary rounded-xl flex items-center justify-center shadow-sm"><i className="fas fa-pen text-[12px]"></i></button>
                        <button onClick={() => { if(confirm('Delete?')) onUpdateAppData({...appData, products: appData.products.filter(i => i.id !== p.id)}); }} className="w-10 h-10 bg-red-50 text-red-600 rounded-xl flex items-center justify-center shadow-sm"><i className="fas fa-trash text-[12px]"></i></button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'home ui' && (
              <div className="space-y-8 animate-fadeIn">
                <div className="bg-white p-6 rounded-[32px] border space-y-4 shadow-sm">
                  <div className="flex justify-between items-center mb-2">
                    <h3 className="text-sm font-black text-gray-900 uppercase tracking-widest">Offer Banner</h3>
                    <label className="switch">
                      <input type="checkbox" checked={appData.settings.homeContent.banner.show} onChange={e => updateHomeContent('banner', 'show', e.target.checked)} />
                      <span className="slider"></span>
                    </label>
                  </div>
                  <div className="space-y-3 text-left">
                    <div><label className="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1 block">Title</label><textarea className="w-full p-4 bg-gray-50 rounded-xl font-bold border outline-none h-20 text-sm" value={appData.settings.homeContent.banner.title} onChange={e => updateHomeContent('banner', 'title', e.target.value)} /></div>
                    <div><label className="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1 block">Badge</label><input className="w-full p-4 bg-gray-50 rounded-xl font-bold border outline-none text-sm" value={appData.settings.homeContent.banner.subtitle} onChange={e => updateHomeContent('banner', 'subtitle', e.target.value)} /></div>
                    <div><label className="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1 block">Banner Image URL</label><input className="w-full p-4 bg-gray-50 rounded-xl font-mono text-xs border outline-none" value={appData.settings.homeContent.banner.image} onChange={e => updateHomeContent('banner', 'image', e.target.value)} /></div>
                  </div>
                </div>

                <div className="bg-white p-6 rounded-[32px] border space-y-4 shadow-sm">
                  <div className="flex justify-between items-center mb-2">
                    <h3 className="text-sm font-black text-gray-900 uppercase tracking-widest">Daily Quote</h3>
                    <label className="switch">
                      <input type="checkbox" checked={appData.settings.homeContent.quote.show} onChange={e => updateHomeContent('quote', 'show', e.target.checked)} />
                      <span className="slider"></span>
                    </label>
                  </div>
                  <div><label className="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1 block">Quote Text</label><textarea className="w-full p-4 bg-gray-50 rounded-xl font-bold border outline-none h-24 italic text-sm" value={appData.settings.homeContent.quote.text} onChange={e => updateHomeContent('quote', 'text', e.target.value)} /></div>
                </div>

                <div className="bg-white p-6 rounded-[32px] border space-y-4 shadow-sm">
                  <div className="flex justify-between items-center mb-2">
                    <h3 className="text-sm font-black text-gray-900 uppercase tracking-widest">Owner's Note</h3>
                    <label className="switch">
                      <input type="checkbox" checked={appData.settings.homeContent.note.show} onChange={e => updateHomeContent('note', 'show', e.target.checked)} />
                      <span className="slider"></span>
                    </label>
                  </div>
                  <div className="space-y-3">
                    <div><label className="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1 block">Note Body</label><textarea className="w-full p-4 bg-gray-50 rounded-xl font-bold border outline-none h-32 text-sm" value={appData.settings.homeContent.note.text} onChange={e => updateHomeContent('note', 'text', e.target.value)} /></div>
                    <div><label className="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1 block">Owner Name</label><input className="w-full p-4 bg-gray-50 rounded-xl font-bold border outline-none text-xs" value={appData.settings.homeContent.note.ownerName} onChange={e => updateHomeContent('note', 'ownerName', e.target.value)} /></div>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'categories' && (
              <div className="space-y-4">
                <button onClick={() => { const n = prompt('New Category:'); if(n) onUpdateAppData({...appData, categories: [...appData.categories, n]}); }} className="w-full py-5 bg-primary text-white rounded-2xl font-black shadow-lg uppercase text-xs tracking-widest active:scale-95 transition-all">ADD CATEGORY</button>
                <div className="space-y-3">
                  {appData.categories.map((cat) => (
                    <div key={cat} className="bg-white p-5 rounded-3xl border flex justify-between items-center shadow-sm">
                      <span className="font-black text-gray-900 uppercase text-xs tracking-widest">{cat}</span>
                      <button onClick={() => { if(confirm('Delete category?')) onUpdateAppData({...appData, categories: appData.categories.filter((c) => c !== cat)}); }} className="text-red-500 p-2"><i className="fas fa-trash"></i></button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'settings' && (
              <div className="bg-white p-8 rounded-[40px] shadow-soft border space-y-8 text-left">
                <div className="space-y-6">
                  <h3 className="text-xs font-black text-primary uppercase tracking-widest">Theme & Configuration</h3>
                  
                  <div>
                    <label className="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2 block ml-2">Theme Primary Color</label>
                    <div className="flex items-center gap-4">
                      <input type="color" className="w-16 h-16 rounded-2xl border-none p-0 overflow-hidden cursor-pointer" value={appData.settings.theme.primary} onChange={e => onUpdateAppData({...appData, settings: {...appData.settings, theme: {...appData.settings.theme, primary: e.target.value}}})} />
                      <span className="font-mono text-xs font-bold uppercase">{appData.settings.theme.primary}</span>
                    </div>
                  </div>

                  <div><label className="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2 block ml-2">Shop Name</label><input type="text" className="w-full p-4 bg-gray-50 rounded-2xl border outline-none font-bold text-gray-800" value={appData.settings.appName} onChange={e => onUpdateAppData({...appData, settings: {...appData.settings, appName: e.target.value}})} /></div>
                  
                  <div className="grid grid-cols-2 gap-4">
                    <div><label className="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2 block ml-2">Platform Fee (₹)</label><input type="number" className="w-full p-4 bg-gray-50 rounded-2xl border outline-none font-bold" value={appData.settings.platformFee} onChange={e => onUpdateAppData({...appData, settings: {...appData.settings, platformFee: parseInt(e.target.value) || 0}})} /></div>
                    <div><label className="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2 block ml-2">Delivery Fee (₹)</label><input type="number" className="w-full p-4 bg-gray-50 rounded-2xl border outline-none font-bold" value={appData.settings.deliveryFee} onChange={e => onUpdateAppData({...appData, settings: {...appData.settings, deliveryFee: parseInt(e.target.value) || 0}})} /></div>
                  </div>
                  
                  <div><label className="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2 block ml-2">WhatsApp Number (91...)</label><input type="text" className="w-full p-4 bg-gray-50 rounded-2xl border outline-none font-bold text-gray-800" value={appData.settings.ownerWhatsApp} onChange={e => onUpdateAppData({...appData, settings: {...appData.settings, ownerWhatsApp: e.target.value}})} /></div>
                  <div><label className="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2 block ml-2">UPI ID for Payments</label><input type="text" className="w-full p-4 bg-gray-50 rounded-2xl border outline-none font-bold text-gray-800" value={appData.settings.upiId} onChange={e => onUpdateAppData({...appData, settings: {...appData.settings, upiId: e.target.value}})} /></div>
                </div>
              </div>
            )}

            {activeTab === 'sync' && (
              <div className="bg-white p-8 rounded-[40px] shadow-soft border space-y-4">
                <div className="bg-orange-50 p-4 rounded-2xl mb-4 text-center">
                  <p className="text-[10px] font-black text-primary uppercase tracking-widest">GitHub Push Sync</p>
                </div>
                <input className="w-full p-4 bg-gray-50 rounded-2xl outline-none text-xs font-mono border" placeholder="Access Token" value={ghToken} onChange={e => setGhToken(e.target.value)} />
                <input className="w-full p-4 bg-gray-50 rounded-2xl outline-none text-xs font-mono border" placeholder="username/repo" value={ghRepo} onChange={e => setGhRepo(e.target.value)} />
                <button disabled={isSyncing} onClick={syncToGithub} className="w-full py-5 bg-primary text-white rounded-2xl font-black shadow-xl uppercase tracking-widest text-sm active:scale-95 transition-all">
                  {syncMessage || 'SYNC DATA'}
                </button>
              </div>
            )}

            {editingProduct && (
              <div className="fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm flex items-end justify-center p-4">
                <div className="bg-white w-full max-w-md rounded-t-[40px] p-8 animate-slideUp overflow-y-auto max-h-[90vh] shadow-2xl">
                  <h3 className="text-xl font-black mb-8 uppercase text-gray-900 tracking-tighter">PRODUCT EDITOR</h3>
                  <div className="space-y-4 text-left">
                    <div><label className="text-[10px] font-black text-gray-400 uppercase mb-1 block">NAME</label><input className="w-full p-4 bg-gray-50 rounded-xl font-bold border outline-none" value={editingProduct.name} onChange={e => setEditingProduct({...editingProduct, name: e.target.value})} /></div>
                    <div className="grid grid-cols-2 gap-4">
                      <div><label className="text-[10px] font-black text-gray-400 uppercase mb-1 block">PRICE (₹)</label><input type="number" className="w-full p-4 bg-gray-50 rounded-xl font-bold border outline-none" value={editingProduct.price} onChange={e => setEditingProduct({...editingProduct, price: parseInt(e.target.value) || 0})} /></div>
                      <div><label className="text-[10px] font-black text-gray-400 uppercase mb-1 block">WEIGHT</label><input className="w-full p-4 bg-gray-50 rounded-xl font-bold border outline-none" value={editingProduct.weight} onChange={e => setEditingProduct({...editingProduct, weight: e.target.value})} /></div>
                    </div>
                    <div><label className="text-[10px] font-black text-gray-400 uppercase mb-1 block">DESCRIPTION</label><textarea className="w-full p-4 bg-gray-50 rounded-xl font-medium border h-24 outline-none" placeholder="About this product..." value={editingProduct.description} onChange={e => setEditingProduct({...editingProduct, description: e.target.value})} /></div>
                    <div className="pt-6 flex gap-3">
                      <button onClick={() => setEditingProduct(null)} className="flex-1 py-4 bg-gray-100 text-gray-400 rounded-2xl font-black uppercase text-xs tracking-widest active:scale-95 transition-all">CANCEL</button>
                      <button onClick={() => {
                        const newList = editingProduct.isNew ? [...appData.products, { ...editingProduct, id: Date.now().toString(), isNew: undefined }] : appData.products.map((p) => p.id === editingProduct.id ? editingProduct : p);
                        onUpdateAppData({...appData, products: newList});
                        setEditingProduct(null);
                      }} className="flex-2 py-4 bg-primary text-white rounded-2xl font-black uppercase text-xs shadow-lg tracking-widest active:scale-95 transition-all">SAVE</button>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      };

      const App = () => {
        const [view, setView] = useState('home'); 
        const [isLoading, setIsLoading] = useState(true);
        const [showAbout, setShowAbout] = useState(false);
        const [deferredPrompt, setDeferredPrompt] = useState(null);
        const [showInstallPopup, setShowInstallPopup] = useState(false);
        
        const [appData, setAppData] = useState({
          products: INITIAL_PRODUCTS,
          categories: ['Sweets', 'Cakes', 'Snacks', 'Drinks'],
          settings: DEFAULT_SETTINGS
        });
        const [cart, setCart] = useState([]);
        const [orders, setOrders] = useState([]);
        const [category, setCategory] = useState('Sweets');
        const [profile, setProfile] = useState(null);
        const [deliveryMethod, setDeliveryMethod] = useState('home');
        const [paymentMethod, setPaymentMethod] = useState('cod');

        // PWA Install Logic
        useEffect(() => {
          const handleBeforeInstall = (e) => {
            e.preventDefault();
            // Don't show if already installed
            if (window.matchMedia('(display-mode: standalone)').matches) return;
            
            // Don't show if dismissed in the last 24 hours
            const lastDismissed = localStorage.getItem('pwa_dismissed');
            if (lastDismissed && Date.now() - parseInt(lastDismissed) < 86400000) return;

            setDeferredPrompt(e);
            setShowInstallPopup(true);
          };

          window.addEventListener('beforeinstallprompt', handleBeforeInstall);
          
          // Register Service Worker
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW failed', err));
          }

          return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstall);
        }, []);

        const handleInstallClick = async () => {
          if (!deferredPrompt) return;
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') {
            setShowInstallPopup(false);
          }
          setDeferredPrompt(null);
        };

        const handleDismissInstall = () => {
          setShowInstallPopup(false);
          localStorage.setItem('pwa_dismissed', Date.now().toString());
        };

        useEffect(() => {
          const init = async () => {
            try {
              const savedData = localStorage.getItem('ramdev_v17_data');
              if (savedData) setAppData(JSON.parse(savedData));
            } catch (err) {} finally {
              const storedProfile = localStorage.getItem('ramdev_profile_v17');
              if (storedProfile) setProfile(JSON.parse(storedProfile));
              else setView('onboarding');
              setTimeout(() => {
                const loader = document.getElementById('loader');
                if (loader) { loader.style.opacity = '0'; setTimeout(() => loader.remove(), 400); }
                setIsLoading(false);
              }, 800);
            }
          };
          init();
        }, []);

        useEffect(() => {
          if (!isLoading) {
            localStorage.setItem('ramdev_v17_data', JSON.stringify(appData));
            document.documentElement.style.setProperty('--primary', appData.settings.theme.primary);
          }
        }, [appData, isLoading]);

        const updateCart = (product, delta) => {
          setCart(prev => {
            const existing = prev.find(i => i.id === product.id);
            if (existing) {
              const newQty = existing.quantity + delta;
              return newQty <= 0 ? prev.filter(i => i.id !== product.id) : prev.map(i => i.id === product.id ? { ...i, quantity: newQty } : i);
            }
            return delta > 0 ? [...prev, { ...product, quantity: delta }] : prev;
          });
        };

        const getItemQty = (id) => cart.find(i => i.id === id)?.quantity || 0;
        const cartTotal = cart.reduce((s, i) => s + i.price * i.quantity, 0);
        const totalWithFees = cartTotal + (appData.settings.platformFee || 0) + (deliveryMethod === 'home' ? appData.settings.deliveryFee : 0);

        const handleOrderConfirm = () => {
          const newOrder = { id: Date.now().toString(), date: new Date().toISOString(), cart: [...cart], cartTotal, totalWithFees, profile, deliveryMethod, paymentMethod };
          setOrders([newOrder, ...orders]);
          const msg = `🛍️ *ORDER FROM ${appData.settings.appName}*\n👤 *Customer:* ${profile.fullName}\n📍 *Address:* ${profile.address}\n\n🍰 *Items:*\n${cart.map(i => `• ${i.name} (x${i.quantity}) - ₹${i.price * i.quantity}`).join('\n')}\n\n🔥 *TOTAL: ₹${totalWithFees}*`;
          window.location.href = `https://wa.me/${appData.settings.ownerWhatsApp}?text=${encodeURIComponent(msg)}`;
          setCart([]); setView('home');
        };

        if (isLoading) return null;

        if (view === 'admin_login') return (
          <div className="min-h-screen bg-white flex flex-col items-center justify-center p-8 text-center max-w-md mx-auto">
            <h1 className="text-3xl font-black mb-8 uppercase tracking-tighter">STAFF LOGIN</h1>
            <input type="password" id="admin-pin" placeholder="PIN" className="w-full p-5 bg-gray-50 rounded-2xl border text-center font-bold tracking-[0.5em] mb-4 outline-none focus:ring-2 focus:ring-orange-200" />
            <button onClick={() => { if(document.getElementById('admin-pin').value === ADMIN_PASSWORD) setView('admin_panel'); else alert('Wrong PIN!'); }} className="w-full py-5 bg-primary text-white rounded-2xl font-black shadow-xl active:scale-95 transition-all">LOGIN</button>
            <button onClick={() => setView('home')} className="mt-8 text-gray-400 font-bold uppercase text-xs">Cancel</button>
          </div>
        );

        if (view === 'admin_panel') return <AdminDashboard appData={appData} onUpdateAppData={setAppData} onBack={() => setView('home')} />;

        if (view === 'onboarding') return (
          <div className="min-h-screen bg-white p-10 flex flex-col items-center justify-center text-center fade-in max-w-md mx-auto">
            <h1 className="text-4xl font-black mb-10 uppercase tracking-tighter text-gray-900 leading-none">{appData.settings.appName}</h1>
            <div className="space-y-6 w-full max-w-xs text-left">
              <input className="w-full p-4 bg-gray-50 rounded-2xl border outline-none font-bold" defaultValue={profile?.fullName || ''} placeholder="Your Name" id="reg-name" />
              <input className="w-full p-4 bg-gray-50 rounded-2xl border outline-none font-bold" defaultValue={profile?.phone || ''} placeholder="Phone Number" id="reg-phone" />
              <textarea className="w-full p-4 bg-gray-50 rounded-2xl border outline-none font-bold" defaultValue={profile?.address || ''} placeholder="Delivery Address" id="reg-address" rows={3} />
              <button onClick={() => {
                const p = { fullName: document.getElementById('reg-name').value, phone: document.getElementById('reg-phone').value, address: document.getElementById('reg-address').value };
                if (p.fullName && p.phone && p.address) { setProfile(p); localStorage.setItem('ramdev_profile_v17', JSON.stringify(p)); setView('home'); }
              }} className="w-full py-5 bg-primary text-white rounded-2xl font-black shadow-xl active:scale-95 transition-all uppercase tracking-widest text-sm">Save & Continue</button>
            </div>
          </div>
        );

        const h = appData.settings.homeContent;

        return (
          <div className="min-h-screen max-w-md mx-auto relative bg-white overflow-x-hidden">
            {/* Custom PWA Install Popup */}
            {showInstallPopup && (
              <div className="fixed top-4 left-4 right-4 z-[200] animate-slideUp">
                <div className="bg-white rounded-3xl p-5 shadow-2xl border border-orange-100 flex items-center gap-4">
                  <div className="w-12 h-12 bg-primary rounded-2xl flex items-center justify-center text-white text-xl flex-shrink-0 shadow-lg">R</div>
                  <div className="flex-1">
                    <h4 className="text-xs font-black text-gray-900 uppercase">Install RamDev App</h4>
                    <p className="text-[10px] text-gray-500 font-medium">Faster access & full-screen view!</p>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={handleDismissInstall} className="w-8 h-8 flex items-center justify-center text-gray-300"><i className="fas fa-times"></i></button>
                    <button onClick={handleInstallClick} className="bg-primary text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest shadow-md">Install</button>
                  </div>
                </div>
              </div>
            )}

            {/* Header */}
            <header className="fixed top-0 left-0 right-0 max-w-md mx-auto z-50 bg-white/95 backdrop-blur-sm border-b px-4 py-3 flex items-center justify-between">
              <div onClick={() => setView('home')} className="flex items-center gap-3 cursor-pointer">
                <div className="w-10 h-10 bg-primary rounded-xl flex items-center justify-center text-white font-black shadow-lg">R</div>
                <div className="text-left leading-none"><h1 className="text-base font-black text-gray-900 tracking-tighter uppercase">{appData.settings.appName}</h1><p className="text-[10px] text-primary font-black uppercase mt-1">HI, {profile?.fullName?.split(' ')[0]}</p></div>
              </div>
              <div className="flex gap-2">
                <button onClick={() => setView('orders')} className="w-10 h-10 flex items-center justify-center text-gray-400"><i className="fas fa-history text-lg"></i></button>
                <button onClick={() => setView('cart')} className="relative w-10 h-10 flex items-center justify-center text-gray-700">
                  {cart.length > 0 && <span className="absolute -top-1 -right-1 bg-red-600 text-white text-[8px] font-black w-4 h-4 rounded-full flex items-center justify-center border-2 border-white">{cart.length}</span>}
                  <i className="fas fa-shopping-basket text-xl"></i>
                </button>
              </div>
            </header>

            {/* Content Views */}
            <main className="pt-20 pb-40 px-4 fade-in">
              {view === 'home' && (
                <div className="space-y-8 animate-fadeIn">
                  {h.banner.show && (
                    <div className="relative w-full h-52 rounded-[32px] overflow-hidden shadow-2xl bg-gradient-to-br from-orange-400 to-orange-600">
                      <img src={h.banner.image} className="w-full h-full object-cover mix-blend-overlay opacity-60" />
                      <div className="absolute inset-0 p-8 flex flex-col justify-center items-start text-white">
                        <span className="bg-white/20 backdrop-blur px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest mb-3">{h.banner.subtitle}</span>
                        <h2 className="text-3xl font-black tracking-tighter uppercase leading-none mb-3 whitespace-pre-line">{h.banner.title}</h2>
                        <p className="text-[10px] font-bold uppercase opacity-80 tracking-widest">{h.banner.footer}</p>
                      </div>
                    </div>
                  )}

                  {h.quote.show && (
                    <div className="bg-white p-8 rounded-[40px] shadow-soft border border-orange-50 text-center italic transition-transform hover:scale-[1.01]">
                      <i className="fas fa-quote-left text-orange-200 text-4xl block mb-4"></i>
                      <p className="text-lg font-medium text-gray-800 tracking-tight leading-relaxed">{h.quote.text}</p>
                      <span className="text-[10px] font-black uppercase tracking-widest text-primary mt-6 block">— {h.quote.author}</span>
                    </div>
                  )}

                  {h.note.show && (
                    <div className="bg-orange-50/50 p-8 rounded-[40px] border border-orange-100">
                      <h3 className="text-[10px] font-black text-primary uppercase tracking-[0.2em] mb-4">Shop News</h3>
                      <p className="text-sm text-gray-600 leading-relaxed font-medium mb-6">{h.note.text}</p>
                      <div className="flex items-center gap-3">
                         <div className="w-10 h-10 bg-white rounded-full flex items-center justify-center text-primary shadow-sm"><i className="fas fa-signature"></i></div>
                         <div><p className="text-xs font-black text-gray-900 uppercase">{h.note.ownerName}</p></div>
                      </div>
                    </div>
                  )}

                  <button onClick={() => setView('catalog')} className="w-full py-6 bg-primary text-white rounded-[28px] font-black shadow-2xl uppercase tracking-widest text-sm active:scale-95 transition-all">Go to Menu <i className="fas fa-arrow-right ml-2"></i></button>
                </div>
              )}

              {view === 'catalog' && (
                <div className="animate-fadeIn">
                  <nav className="flex gap-2 mb-8 overflow-x-auto no-scrollbar py-2">
                    {appData.categories.map(cat => (
                      <button key={cat} onClick={() => setCategory(cat)} className={`px-6 py-2.5 rounded-full text-[11px] font-black uppercase tracking-widest transition-all flex-shrink-0 shadow-sm ${category === cat ? 'bg-primary text-white' : 'bg-white text-orange-900 border'}`}>{cat}</button>
                    ))}
                  </nav>
                  <div className="grid grid-cols-2 gap-4">
                    {appData.products.filter(p => p.category === category).map(p => {
                      const qty = getItemQty(p.id);
                      return (
                        <div key={p.id} className="bg-white rounded-[28px] overflow-hidden shadow-soft border flex flex-col h-full text-left transition-all active:scale-[0.98]">
                          <div className="h-40 bg-gray-100 relative overflow-hidden group">
                            <img src={p.image} className="w-full h-full object-cover transition-transform group-hover:scale-110" onError={e=>e.target.src='https://via.placeholder.com/300?text=Sweet'} />
                            <div className="absolute bottom-3 right-3">
                              {qty === 0 ? (
                                <button onClick={() => updateCart(p, 1)} className="px-5 py-2 bg-white text-primary font-black text-[10px] rounded-xl shadow-xl border">ADD</button>
                              ) : (
                                <div className="flex items-center bg-white rounded-xl border shadow-xl overflow-hidden">
                                  <button onClick={() => updateCart(p, -1)} className="px-3 py-2 text-primary"><i className="fas fa-minus text-[8px]"></i></button>
                                  <span className="px-2 text-xs font-black text-orange-900">{qty}</span>
                                  <button onClick={() => updateCart(p, 1)} className="px-3 py-2 text-primary"><i className="fas fa-plus text-[8px]"></i></button>
                                </div>
                              )}
                            </div>
                          </div>
                          <div className="p-4 flex-1 flex flex-col">
                            <h3 className="text-[13px] font-black text-gray-900 mb-1 leading-tight tracking-tight">{p.name}</h3>
                            <p className="text-[10px] text-gray-400 mb-4 flex-1 line-clamp-2 leading-tight font-medium">{p.description}</p>
                            <div className="mt-auto flex justify-between items-center"><span className="text-base font-black text-primary">₹{p.price}</span><span className="text-[9px] font-black text-gray-300 uppercase">{p.weight}</span></div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {view === 'cart' && (
                <div className="fade-in animate-fadeIn">
                  <h2 className="text-2xl font-black uppercase mb-8 tracking-tighter">Your Cart</h2>
                  <div className="space-y-4 mb-8">
                    {cart.map(item => (
                      <div key={item.id} className="flex gap-4 p-4 bg-orange-50/20 rounded-[32px] border">
                        <img src={item.image} className="w-20 h-20 object-cover rounded-2xl" />
                        <div className="flex-1">
                          <h4 className="font-black text-gray-900 text-sm mb-1">{item.name}</h4>
                          <p className="text-primary font-black text-lg">₹{item.price * item.quantity}</p>
                          <div className="flex items-center gap-4 mt-2">
                            <button onClick={() => updateCart(item, -1)} className="w-8 h-8 bg-white rounded-xl border flex items-center justify-center text-xs"><i className="fas fa-minus"></i></button>
                            <span className="font-black text-gray-900">{item.quantity}</span>
                            <button onClick={() => updateCart(item, 1)} className="w-8 h-8 bg-white rounded-xl border flex items-center justify-center text-xs"><i className="fas fa-plus"></i></button>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                  {cart.length === 0 ? <div className="py-20 text-center text-gray-300 font-bold uppercase text-xs tracking-widest">Cart is empty</div> : (
                    <>
                      <div className="bg-gray-50 p-8 rounded-[40px] space-y-3 mb-12 border">
                        <div className="flex justify-between text-xs font-bold text-gray-500 uppercase"><span>Subtotal</span><span className="text-gray-900">₹{cartTotal}</span></div>
                        <div className="flex justify-between text-xs font-bold text-gray-500 uppercase"><span>Platform Fee</span><span className="text-gray-900">₹{appData.settings.platformFee}</span></div>
                        <div className="border-t pt-4 flex justify-between items-center mt-2">
                          <span className="font-black text-gray-900 uppercase text-xs">Total Amount</span>
                          <span className="text-2xl font-black text-primary">₹{totalWithFees}</span>
                        </div>
                      </div>
                      <button onClick={() => setView('checkout')} className="w-full py-5 bg-primary text-white rounded-[24px] font-black shadow-xl uppercase tracking-widest text-sm active:scale-95 transition-all">Proceed to Checkout</button>
                    </>
                  )}
                </div>
              )}

              {view === 'checkout' && (
                <div className="fade-in animate-fadeIn pb-20">
                  <h2 className="text-2xl font-black uppercase mb-8 tracking-tighter">Confirm</h2>
                  <div className="space-y-10">
                    <div>
                      <label className="text-[10px] font-black text-gray-400 uppercase tracking-widest block mb-4 ml-2">Delivery</label>
                      <div className="grid grid-cols-2 gap-4">
                        <button onClick={() => setDeliveryMethod('home')} className={`p-6 rounded-[28px] border-2 flex flex-col items-center gap-3 ${deliveryMethod === 'home' ? 'border-primary bg-orange-50 text-orange-900 shadow-md' : 'border-gray-50 bg-gray-50 text-gray-400'}`}><i className="fas fa-truck text-2xl"></i><span className="font-black text-[10px] uppercase tracking-widest">Home</span></button>
                        <button onClick={() => setDeliveryMethod('pickup')} className={`p-6 rounded-[28px] border-2 flex flex-col items-center gap-3 ${deliveryMethod === 'pickup' ? 'border-primary bg-orange-50 text-orange-900 shadow-md' : 'border-gray-50 bg-gray-50 text-gray-400'}`}><i className="fas fa-store text-2xl"></i><span className="font-black text-[10px] uppercase tracking-widest">Pickup</span></button>
                      </div>
                    </div>
                    <div>
                      <label className="text-[10px] font-black text-gray-400 uppercase tracking-widest block mb-4 ml-2">Payment</label>
                      <div className="space-y-4">
                        <button onClick={() => setPaymentMethod('cod')} className={`w-full p-6 rounded-[28px] border-2 flex items-center gap-5 ${paymentMethod === 'cod' ? 'border-primary bg-orange-50 text-orange-900 shadow-md' : 'border-gray-50 bg-gray-50 text-gray-400'}`}><i className="fas fa-money-bill-wave text-2xl"></i><span className="font-black text-xs uppercase tracking-widest">Cash on Delivery</span></button>
                        <button onClick={() => setPaymentMethod('upi')} className={`w-full p-6 rounded-[28px] border-2 flex items-center gap-5 ${paymentMethod === 'upi' ? 'border-primary bg-orange-50 text-orange-900 shadow-md' : 'border-gray-50 bg-gray-50 text-gray-400'}`}><i className="fas fa-qrcode text-2xl"></i><span className="font-black text-xs uppercase tracking-widest">UPI QR Pay</span></button>
                      </div>
                    </div>
                    {paymentMethod === 'upi' && (
                      <div className="bg-white p-8 rounded-[40px] border-2 border-dashed border-orange-200 text-center animate-slideUp">
                         <img src={`https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=upi://pay?pa=${appData.settings.upiId}%26pn=${encodeURIComponent(appData.settings.appName)}%26am=${totalWithFees}%26cu=INR`} className="mx-auto w-44 h-44 rounded-2xl shadow-xl mb-4 border-4 border-white" />
                         <p className="text-[10px] text-gray-400 font-bold uppercase tracking-widest">Send screenshot on WhatsApp</p>
                      </div>
                    )}
                  </div>
                  <button onClick={handleOrderConfirm} className="w-full bg-green-600 text-white font-black py-5 rounded-[24px] shadow-xl flex items-center justify-center gap-3 uppercase tracking-widest text-sm active:scale-95 transition-all mt-10">PLACE ORDER <i className="fab fa-whatsapp text-2xl"></i></button>
                </div>
              )}

              {view === 'orders' && (
                <div className="fade-in animate-fadeIn">
                  <h2 className="text-2xl font-black uppercase mb-8 tracking-tighter">Order History</h2>
                  {orders.length === 0 ? <div className="py-20 text-center text-gray-300 font-bold uppercase text-xs tracking-widest">No previous orders</div> : (
                    <div className="space-y-6">
                      {orders.map(order => (
                        <div key={order.id} className="bg-white rounded-[32px] border shadow-soft p-6 flex justify-between items-center transition-transform hover:scale-[1.01]">
                          <div><span className="text-[10px] font-black text-orange-600 uppercase tracking-widest block mb-1">#{order.id.slice(-6).toUpperCase()}</span><h4 className="text-xs font-bold text-gray-900">{new Date(order.date).toLocaleDateString()}</h4><span className="text-xl font-black text-primary">₹{order.totalWithFees}</span></div>
                          <button onClick={() => generateInvoicePDF(order, appData.settings.appName)} className="w-12 h-12 bg-orange-50 text-primary rounded-2xl flex items-center justify-center shadow-sm active:scale-90 transition-all"><i className="fas fa-file-invoice text-lg"></i></button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}
            </main>

            {/* Footer Navigation */}
            <footer className="fixed bottom-0 left-0 right-0 max-w-md mx-auto z-40 bg-white border-t border-orange-50 px-6 py-4 flex justify-between items-center shadow-soft">
              <button onClick={() => setView('catalog')} className={`flex flex-col items-center gap-1 transition-colors ${view === 'catalog' ? 'text-primary' : 'text-gray-400'}`}>
                <i className="fas fa-th-large text-xl"></i>
                <span className="text-[9px] font-black uppercase tracking-widest">Menu</span>
              </button>
              <div onClick={() => setView('home')} className={`w-14 h-14 rounded-full -mt-10 flex items-center justify-center shadow-xl border-4 border-white cursor-pointer transition-all hover:scale-110 active:scale-95 ${view === 'home' ? 'bg-primary text-white' : 'bg-gray-100 text-gray-400'}`}>
                <i className="fas fa-home text-xl"></i>
              </div>
              <button onClick={() => setShowAbout(true)} className={`flex flex-col items-center gap-1 transition-colors ${showAbout ? 'text-primary' : 'text-gray-400'}`}>
                <i className="fas fa-info-circle text-xl"></i>
                <span className="text-[9px] font-black uppercase tracking-widest">About</span>
              </button>
            </footer>

            {/* About Modal */}
            {showAbout && (
              <div className="fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm flex items-end justify-center">
                <div onClick={() => setShowAbout(false)} className="absolute inset-0"></div>
                <div className="bg-white w-full max-w-md rounded-t-[40px] p-8 animate-slideUp relative shadow-2xl">
                  <div className="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-8"></div>
                  <div className="text-center mb-8">
                    <div className="w-20 h-20 bg-orange-100 rounded-3xl mx-auto flex items-center justify-center text-primary text-3xl mb-4 shadow-inner"><i className="fas fa-shop"></i></div>
                    <h2 className="text-2xl font-black text-gray-900 mb-1 tracking-tighter">{appData.settings.appName}</h2>
                    <p className="text-orange-600 font-bold text-xs uppercase tracking-widest">Premium Quality Sweets</p>
                  </div>
                  <div className="space-y-4 mb-10 text-center">
                    <p className="text-sm text-gray-600 leading-relaxed font-medium">Authentic Indian sweets and premium cakes prepared with the finest ingredients and pure ghee.</p>
                    <div className="border-t pt-4">
                      <button onClick={() => { setShowAbout(false); setView('admin_login'); }} className="text-[10px] text-gray-300 font-black uppercase tracking-widest hover:text-primary transition-colors">Staff Access</button>
                    </div>
                  </div>
                  <button onClick={() => setShowAbout(false)} className="w-full bg-primary text-white font-black py-4 rounded-2xl shadow-xl uppercase tracking-widest text-xs active:scale-95 transition-all">Close</button>
                </div>
              </div>
            )}
          </div>
        );
      };

      const container = document.getElementById('root');
      const root = createRoot(container);
      root.render(<App />);
    </script>
  </body>
</html>
